<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FormCheck.ai</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <h1>FormCheck.ai</h1>

    <!-- ========================= -->
    <!-- CAMERA SECTION             -->
    <!-- ========================= -->

    <div id="video-container">

        <video
            id="video"
            autoplay
            playsinline
            muted
        ></video>

        <canvas id="canvas"></canvas>

    </div>


    <!-- ========================= -->
    <!-- CAMERA CONTROLS            -->
    <!-- ========================= -->

    <div id="camera-controls">

        <select id="camera">
            <option value="">Select Camera</option>
        </select>

        <button id="start-button">
            Start Camera
        </button>

        <button id="stop-button">
            Stop Camera
        </button>

    </div>


    <!-- ========================= -->
    <!-- FORM STATUS                -->
    <!-- ========================= -->

    <div id="form-status">
        Camera not started
    </div>


    <!-- ========================= -->
    <!-- STATS                      -->
    <!-- ========================= -->

    <div id="stats">

        <div>
            <h2>Reps</h2>
            <p id="rep-count">0</p>
        </div>

        <div>
            <h2>Rating</h2>
            <p id="angle"><span id="rating">0</span>/100</p>
        </div>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT                 -->
    <!-- ========================= -->

    <script
        type="module"
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
